<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gedanke des Tages</title>

<!-- Moderne ruhige Schrift -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'DM Sans', sans-serif;

  /* Warmer Natur-Gradient */
  background: linear-gradient(135deg, #e6d5c3, #d6c1a3, #b7b09c);
  background-attachment: fixed;
}

.popup {
  max-width: 90%;
  padding: 40px 32px;

  /* Glas Effekt */
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-radius: 24px;

  /* Leichter natürlicher Schatten */
  box-shadow: 
    0 10px 40px rgba(0,0,0,0.08),
    0 2px 8px rgba(0,0,0,0.05);

  text-align: center;
  animation: fadeIn .6s ease;
}

p {
  font-size: 1.5rem;
  line-height: 1.6;
  font-weight: 500;
  color: #3e3e3e;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(15px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="popup">
  <p id="spruch"></p>
</div>

<script>
const SPRUECHE = [
  "Jeder Tag ist eine neue Chance.",
  "Du bist weiter, als du denkst."
];

const GEBURTSTAG_TEXT = "🎉 Heute ist ein ganz besonderer Tag. Vergiss nie, wie wertvoll du bist. Happy Birthday du wundervoller Mensch.♥️💐";

/* Berliner Datum */
function getBerlinDate() {
  const parts = new Intl.DateTimeFormat("de-DE", {
    timeZone: "Europe/Berlin",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const map = {};
  parts.forEach(p => map[p.type] = p.value);

  return {
    year: map.year,
    month: map.month,
    day: map.day
  };
}

function getDayOfYear(year, month, day) {
  const start = new Date(year, 0, 1);
  const current = new Date(year, month - 1, day);
  return Math.floor((current - start) / 86400000) + 1;
}

/* Fisher-Yates Shuffle */
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function getTodayMessage() {
  const {year, month, day} = getBerlinDate();

  /* 🎂 06.03 Sonderregel */
  if (day === "06" && month === "03") {
    return GEBURTSTAG_TEXT;
  }

  const dayOfYear = getDayOfYear(Number(year), Number(month), Number(day));
  const storageKey = "spruch_data_" + year;

  let data = JSON.parse(localStorage.getItem(storageKey));

  if (!data) {
    data = {
      shuffled: shuffle([...SPRUECHE]),
      index: 0,
      lastDay: dayOfYear
    };
  }

  if (data.lastDay !== dayOfYear) {
    data.index++;

    if (data.index >= data.shuffled.length) {
      data.shuffled = shuffle([...SPRUECHE]);
      data.index = 0;
    }

    data.lastDay = dayOfYear;
  }

  localStorage.setItem(storageKey, JSON.stringify(data));
  return data.shuffled[data.index];
}

document.getElementById("spruch").innerText = getTodayMessage();
</script>

</body>
</html>
