<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gedanke des Tages</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@400&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3efe8;
  font-family:'Inter', sans-serif;
  position:relative;
  overflow:hidden;
}

/* organische beige Flächen */
.shape1, .shape2 {
  position:absolute;
  width:300px;
  height:300px;
  background:#e6d8c7;
  border-radius:50%;
  filter:blur(40px);
  opacity:0.6;
}

.shape1 { top:-80px; left:-80px; }
.shape2 { bottom:-80px; right:-80px; }

/* Line Art Pflanzen (SVG Stil) */
.plant-top, .plant-bottom {
  position:absolute;
  width:180px;
  opacity:0.6;
}

.plant-top { top:40px; left:20px; }
.plant-bottom { bottom:40px; right:20px; transform: rotate(180deg); }

/* Glas-Text */
.quote-box {
  padding:18px 28px;
  border-radius:16px;

  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  text-align:center;
}

.quote-box p {
  font-family:'Caveat', cursive;
  font-size:1.9rem;
  margin:0;
  color:#3d3d3d;
}
</style>
</head>

<body>

<div class="shape1"></div>
<div class="shape2"></div>

<!-- einfache SVG Line Plant -->
<svg class="plant-top" viewBox="0 0 200 200">
  <path d="M100 180 C120 150 120 100 100 60 C80 100 80 150 100 180" stroke="#444" stroke-width="2" fill="none"/>
  <ellipse cx="100" cy="120" rx="20" ry="40" stroke="#444" fill="none"/>
</svg>

<svg class="plant-bottom" viewBox="0 0 200 200">
  <path d="M100 180 C120 150 120 100 100 60 C80 100 80 150 100 180" stroke="#444" stroke-width="2" fill="none"/>
  <ellipse cx="100" cy="120" rx="20" ry="40" stroke="#444" fill="none"/>
</svg>

<div class="quote-box">
  <p id="spruch"></p>
</div>

<script>
const SPRUECHE = [
  "Jeder Tag ist eine neue Chance.",
  "Du bist weiter, als du denkst."
];

const GEBURTSTAG_TEXT = "🎉 Heute ist ein ganz besonderer Tag. Vergiss nie, wie wertvoll du bist. Happy Birthday du wundervoller Mensch.♥️💐";

function getBerlinDate() {
  const parts = new Intl.DateTimeFormat("de-DE", {
    timeZone: "Europe/Berlin",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const map = {};
  parts.forEach(p => map[p.type] = p.value);
  return { year: map.year, month: map.month, day: map.day };
}

function getDayOfYear(year, month, day) {
  const start = new Date(year, 0, 1);
  const current = new Date(year, month - 1, day);
  return Math.floor((current - start) / 86400000) + 1;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function getTodayMessage() {
  const {year, month, day} = getBerlinDate();

  if (day === "06" && month === "03") {
    return GEBURTSTAG_TEXT;
  }

  const dayOfYear = getDayOfYear(Number(year), Number(month), Number(day));
  const storageKey = "spruch_data_" + year;

  let data = JSON.parse(localStorage.getItem(storageKey));

  if (!data) {
    data = {
      shuffled: shuffle([...SPRUECHE]),
      index: 0,
      lastDay: dayOfYear
    };
  }

  if (data.lastDay !== dayOfYear) {
    data.index++;
    if (data.index >= data.shuffled.length) {
      data.shuffled = shuffle([...SPRUECHE]);
      data.index = 0;
    }
    data.lastDay = dayOfYear;
  }

  localStorage.setItem(storageKey, JSON.stringify(data));
  return data.shuffled[data.index];
}

document.getElementById("spruch").innerText = getTodayMessage();
</script>

</body>
</html>
