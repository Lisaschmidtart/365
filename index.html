<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gedanke des Tages</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-family:'Inter', sans-serif;
  color:#2e2e2e;

  /* Aesthetic Plant Wallpaper */
  background-image: url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6?q=80&w=1200");
  background-size: cover;
  background-position: center;
  position: relative;
}

/* sanfte Abdunklung für bessere Lesbarkeit */
body::before {
  content:"";
  position:absolute;
  inset:0;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(2px);
}

.quote-container {
  position:relative;
  max-width: 85%;
  padding: 40px 30px;
}

p {
  font-family:'Playfair Display', serif;
  font-size: 1.6rem;
  line-height: 1.6;
  font-weight: 500;
}

</style>
</head>

<body>

<div class="quote-container">
  <p id="spruch"></p>
</div>

<script>
const SPRUECHE = [
  "Jeder Tag ist eine neue Chance.",
  "Du bist weiter, als du denkst."
];

const GEBURTSTAG_TEXT = "🎉 Heute ist ein ganz besonderer Tag. Vergiss nie, wie wertvoll du bist. Happy Birthday du wundervoller Mensch.♥️💐";

function getBerlinDate() {
  const parts = new Intl.DateTimeFormat("de-DE", {
    timeZone: "Europe/Berlin",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const map = {};
  parts.forEach(p => map[p.type] = p.value);

  return { year: map.year, month: map.month, day: map.day };
}

function getDayOfYear(year, month, day) {
  const start = new Date(year, 0, 1);
  const current = new Date(year, month - 1, day);
  return Math.floor((current - start) / 86400000) + 1;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function getTodayMessage() {
  const {year, month, day} = getBerlinDate();

  if (day === "06" && month === "03") {
    return GEBURTSTAG_TEXT;
  }

  const dayOfYear = getDayOfYear(Number(year), Number(month), Number(day));
  const storageKey = "spruch_data_" + year;

  let data = JSON.parse(localStorage.getItem(storageKey));

  if (!data) {
    data = {
      shuffled: shuffle([...SPRUECHE]),
      index: 0,
      lastDay: dayOfYear
    };
  }

  if (data.lastDay !== dayOfYear) {
    data.index++;
    if (data.index >= data.shuffled.length) {
      data.shuffled = shuffle([...SPRUECHE]);
      data.index = 0;
    }
    data.lastDay = dayOfYear;
  }

  localStorage.setItem(storageKey, JSON.stringify(data));
  return data.shuffled[data.index];
}

document.getElementById("spruch").innerText = getTodayMessage();
</script>

</body>
</html>
